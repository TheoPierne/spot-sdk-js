name: 'Tests'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # npm test passes a glob to node --test: Node.js 21 or newer.
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The tests have their own package (seedrandom).
      - name: Install test dependencies
        run: npm ci --prefix test

      - name: Lint
        run: npm run lint

      # typings/ is generated from the JSDoc of src/ (npm run build:typings): it must be up to date, and valid.
      - name: Check the typings
        run: |
          npm run build:typings
          test -z "$(git status --porcelain -- typings)"
          npm run test:typings

      - name: Run tests
        run: npm test
